<!doctype html><title>ONNX feasibility</title><pre id="result">pending</pre>
<script type="module">
import * as ort from './node_modules/onnxruntime-web/dist/ort.min.mjs';
try {
  ort.env.wasm.wasmPaths = '/node_modules/onnxruntime-web/dist/';
  ort.env.wasm.numThreads = 1;
  const session = await ort.InferenceSession.create('./model.onnx', { executionProviders: ['wasm'] });
  const result = await session.run({image: new ort.Tensor('float32', new Float32Array(3*256*256), [1,3,256,256])});
  document.querySelector('#result').textContent = JSON.stringify({shape: result.logits.dims, finite: result.logits.data.every(Number.isFinite)});
} catch (e) { document.querySelector('#result').textContent = `error: ${e.stack}`; }
</script>
