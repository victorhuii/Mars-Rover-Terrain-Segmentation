<!doctype html><title>ONNX browser parity</title><pre id="result">pending</pre>
<script type="module">
import * as ort from './node_modules/onnxruntime-web/dist/ort.min.mjs';
try {
  ort.env.wasm.wasmPaths = '/node_modules/onnxruntime-web/dist/';
  ort.env.wasm.numThreads = 1;
  const read = async path => { const response = await fetch(path); if (!response.ok) throw new Error(`Fetch failed: ${path}`); return new Float32Array(await response.arrayBuffer()); };
  const [input, expected] = await Promise.all([read('./input.bin'), read('./expected.bin')]);
  const side = Math.sqrt(input.length / 3);
  if (!Number.isInteger(side) || expected.length !== side * side * 4) throw new Error('Invalid tensor sizes');
  const session = await ort.InferenceSession.create('./model.onnx', { executionProviders: ['wasm'] });
  const output = (await session.run({image: new ort.Tensor('float32', input, [1,3,side,side])})).logits;
  let maxError = 0, agrees = 0, pixels = side * side;
  for (let i = 0; i < output.data.length; i++) maxError = Math.max(maxError, Math.abs(output.data[i] - expected[i]));
  for (let p = 0; p < pixels; p++) {
    let a = 0, b = 0;
    for (let c = 1; c < 4; c++) { if (output.data[c*pixels+p] > output.data[a*pixels+p]) a = c; if (expected[c*pixels+p] > expected[b*pixels+p]) b = c; }
    if (a === b) agrees++;
  }
  document.querySelector('#result').textContent = JSON.stringify({shape: output.dims, finite: output.data.every(Number.isFinite), maxError, agreement: agrees / pixels});
} catch (e) { document.querySelector('#result').textContent = `error: ${e.stack}`; }
</script>
