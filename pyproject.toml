[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marsterrain"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy==2.4.2", "Pillow==12.3.0", "pyarrow==26.0.1"]

[project.optional-dependencies]
eda = ["matplotlib==3.11.2"]
training = ["torch==2.15.0", "torchvision==0.29.2"]
export = ["onnx==1.23.2", "onnxruntime==1.32.0", "onnxscript==0.7.2"]

[tool.setuptools.packages.find]
where = ["src"]
